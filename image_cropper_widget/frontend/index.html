<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./cropper.min.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #0a0c0f;
      font-family: 'IBM Plex Mono', monospace;
      color: #8b939e;
    }
    .cropper-root { padding: 0.25rem 0; }
    .cropper-wrap {
      max-height: 52vh;
      min-height: 220px;
      overflow: hidden;
      background: #12151a;
      border: 1px solid #3d4450;
      border-radius: 2px;
    }
    .cropper-wrap img {
      display: block;
      max-width: 100%;
    }
    .cropper-hint {
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 0.35rem;
      color: #8b939e;
    }
    .cropper-error {
      color: #ff3d3d;
      font-size: 0.68rem;
      margin-top: 0.35rem;
    }
  </style>
</head>
<body>
  <div class="cropper-root">
    <div class="cropper-wrap">
      <img id="source" alt="Crop preview" />
    </div>
    <div class="cropper-hint" id="hint">Drag handles to crop</div>
    <div class="cropper-error" id="error" hidden></div>
  </div>

  <script src="./cropper.min.js"></script>
  <script>
    const img = document.getElementById("source");
    const hint = document.getElementById("hint");
    const errorEl = document.getElementById("error");
    let cropper = null;
    let suppressEvents = false;
    let lastImageData = "";

    function sendToStreamlit(type, data) {
      window.parent.postMessage(
        Object.assign({ isStreamlitMessage: true, type: type }, data),
        "*"
      );
    }

    function setError(message) {
      errorEl.hidden = !message;
      errorEl.textContent = message || "";
    }

    function toNumber(value) {
      const n = Number(value);
      return Number.isFinite(n) ? n : NaN;
    }

    function roundCrop(data) {
      return {
        x: Math.round(data.x),
        y: Math.round(data.y),
        width: Math.max(1, Math.round(data.width)),
        height: Math.max(1, Math.round(data.height)),
      };
    }

    function sendCrop() {
      if (!cropper || suppressEvents) return;
      const data = roundCrop(cropper.getData(true));
      hint.textContent = "Crop: " + data.width + "×" + data.height + " at (" + data.x + ", " + data.y + ")";
      sendToStreamlit("streamlit:setComponentValue", {
        value: data,
        dataType: "json",
      });
    }

    function destroyCropper() {
      if (cropper) {
        cropper.destroy();
        cropper = null;
      }
    }

    function buildAspectRatio(value) {
      const n = toNumber(value);
      return Number.isFinite(n) && n > 0 ? n : NaN;
    }

    function applyInitialCrop(initialCrop) {
      if (!cropper || !initialCrop) return;
      const width = toNumber(initialCrop.width);
      const height = toNumber(initialCrop.height);
      if (!Number.isFinite(width) || !Number.isFinite(height) || width <= 0 || height <= 0) {
        return;
      }
      suppressEvents = true;
      cropper.setData({
        x: toNumber(initialCrop.x) || 0,
        y: toNumber(initialCrop.y) || 0,
        width: width,
        height: height,
      });
      suppressEvents = false;
      sendCrop();
    }

    function initCropper(args) {
      const imageData = args.imageData || "";
      const aspectRatio = buildAspectRatio(args.aspectRatio);
      const initialCrop = args.initialCrop || {};

      if (!imageData) {
        setError("No image data received.");
        return;
      }
      setError("");

      if (imageData === lastImageData && cropper) {
        cropper.setAspectRatio(aspectRatio);
        applyInitialCrop(initialCrop);
        sendToStreamlit("streamlit:setFrameHeight", { height: 460 });
        return;
      }

      lastImageData = imageData;
      destroyCropper();

      img.onload = function () {
        try {
          if (typeof Cropper === "undefined") {
            throw new Error("Cropper.js failed to load.");
          }
          cropper = new Cropper(img, {
            viewMode: 1,
            dragMode: "move",
            autoCropArea: 1,
            responsive: true,
            background: false,
            aspectRatio: aspectRatio,
            crop: function () {
              sendCrop();
            },
          });
          applyInitialCrop(initialCrop);
          if (!initialCrop.width) {
            sendCrop();
          }
          sendToStreamlit("streamlit:setFrameHeight", { height: 460 });
        } catch (err) {
          setError(err && err.message ? err.message : "Could not initialize cropper.");
        }
      };

      img.onerror = function () {
        setError("Could not load image preview.");
      };

      img.src = "data:image/png;base64," + imageData;
    }

    function onRender(event) {
      if (!event.data || event.data.type !== "streamlit:render") return;
      initCropper(event.data.args || {});
    }

    window.addEventListener("message", onRender);
    sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
    sendToStreamlit("streamlit:setFrameHeight", { height: 460 });
  </script>
</body>
</html>
